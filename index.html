<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mehmonlar daftari — MySQL demo</title>
  <meta name="description" content="Ismingizni qoldiring — oddiy mehmonlar daftari.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f2ebdd;
      --paper-deep: #e8dfcc;
      --ink: #221c18;
      --ink-soft: #5d544b;
      --ink-faint: #9a8f81;
      --rule: #d6cab3;
      --accent: #b0542e;
      --accent-deep: #8c3f1f;
      --moss: #4f5b3c;
      --error: #9e2f2a;
      --radius: 14px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Instrument Sans", ui-sans-serif, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 85% -10%, #f8f2e6 0%, transparent 60%),
        radial-gradient(900px 600px at -10% 110%, var(--paper-deep) 0%, transparent 55%),
        var(--paper);
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Paper grain — fixed, non-interactive */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: .35;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .page {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
      gap: clamp(32px, 6vw, 96px);
      max-width: 1180px;
      margin: 0 auto;
      padding: clamp(28px, 6vw, 72px) clamp(20px, 5vw, 56px) 80px;
      align-items: start;
    }

    /* ---------- Left column ---------- */
    .intro {
      position: sticky;
      top: clamp(28px, 6vw, 72px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0;
      animation: rise .8s var(--ease) .05s forwards;
    }
    .eyebrow .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--moss);
      box-shadow: 0 0 0 4px rgba(79, 91, 60, .15);
    }
    .eyebrow.offline .dot { background: var(--error); box-shadow: 0 0 0 4px rgba(158, 47, 42, .15); }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-variation-settings: "opsz" 144;
      font-weight: 400;
      font-size: clamp(52px, 8.4vw, 112px);
      line-height: .9;
      letter-spacing: -.035em;
      margin: 22px 0 26px;
      opacity: 0;
      animation: rise .9s var(--ease) .15s forwards;
    }
    h1 em {
      display: block;
      font-style: italic;
      font-weight: 300;
      color: var(--accent);
      padding-left: .55em;
    }

    .lede {
      max-width: 34ch;
      font-size: 17px;
      color: var(--ink-soft);
      margin: 0 0 40px;
      opacity: 0;
      animation: rise .9s var(--ease) .28s forwards;
    }

    /* ---------- Form ---------- */
    .sign {
      position: relative;
      opacity: 0;
      animation: rise .9s var(--ease) .4s forwards;
    }

    .sign label {
      display: block;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 8px;
    }

    .field {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 6px;
      transition: border-color .25s var(--ease);
    }
    .field:focus-within { border-color: var(--accent); }
    .sign.has-error .field { border-color: var(--error); }

    .field input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: clamp(26px, 3.4vw, 36px);
      color: var(--ink);
      padding: 6px 0;
      outline: none;
    }
    .field input::placeholder { color: var(--ink-faint); opacity: .7; }

    .counter {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      color: var(--ink-faint);
      padding-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 22px;
      min-height: 52px;
    }

    .hint {
      font-size: 13px;
      color: var(--ink-faint);
    }
    .hint kbd {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      padding: 2px 6px;
      border: 1px solid var(--rule);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: #f8f3e9;
      color: var(--ink-soft);
    }
    .sign.has-error .hint { color: var(--error); }

    button.save {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      cursor: pointer;
      font: 600 15px/1 "Instrument Sans", sans-serif;
      letter-spacing: .01em;
      color: var(--paper);
      background: var(--ink);
      padding: 16px 22px 16px 24px;
      border-radius: 999px;
      box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 10px 24px -12px rgba(34, 28, 24, .6);
      transition: transform .2s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease);
    }
    button.save:hover { background: var(--accent-deep); transform: translateY(-2px); }
    button.save:active { transform: translateY(1px) scale(.98); box-shadow: 0 4px 10px -6px rgba(34, 28, 24, .6); }
    button.save:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button.save svg { transition: transform .3s var(--ease); }
    button.save:hover svg { transform: translateX(3px) rotate(-8deg); }
    button.save[disabled] { cursor: progress; opacity: .75; transform: none; }
    button.save[disabled] svg { animation: wiggle .6s ease-in-out infinite; }

    .shake { animation: shake .4s var(--ease); }

    /* ---------- Right column: the ledger ---------- */
    .ledger {
      position: relative;
      background: #f8f3e8;
      border-radius: var(--radius);
      padding: 34px clamp(20px, 4vw, 44px) 28px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.7) inset,
        0 0 0 1px rgba(120, 98, 70, .12),
        0 30px 60px -30px rgba(70, 50, 30, .35),
        0 12px 24px -18px rgba(70, 50, 30, .25);
      transform: rotate(.6deg);
      opacity: 0;
      animation: settle 1s var(--ease) .3s forwards;
    }
    /* binding margin line */
    .ledger::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      left: clamp(52px, 7vw, 76px);
      width: 1px;
      background: rgba(176, 84, 46, .28);
    }
    /* stacked sheet beneath */
    .ledger::after {
      content: "";
      position: absolute;
      inset: 10px -8px -10px 8px;
      border-radius: var(--radius);
      background: #efe6d4;
      box-shadow: 0 0 0 1px rgba(120, 98, 70, .1);
      z-index: -1;
      transform: rotate(-1.6deg);
    }

    .ledger-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-left: clamp(36px, 5vw, 52px);
      padding-bottom: 18px;
      border-bottom: 1px solid var(--rule);
    }
    .ledger-head h2 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: -.01em;
    }
    .tally {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px;
      color: var(--ink-faint);
      font-variant-numeric: tabular-nums;
    }
    .tally strong { color: var(--accent); font-weight: 500; }

    #list {
      list-style: none;
      margin: 0;
      padding: 0;
      counter-reset: entry;
    }

    .entry {
      display: grid;
      grid-template-columns: clamp(36px, 5vw, 52px) 1fr auto;
      align-items: baseline;
      gap: 0 14px;
      padding: 16px 0 14px;
      border-bottom: 1px dashed var(--rule);
      opacity: 0;
      animation: rise .6s var(--ease) forwards;
      animation-delay: calc(var(--i, 0) * 45ms);
    }
    .entry:last-child { border-bottom: 0; }

    .entry .num {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      color: var(--ink-faint);
      text-align: right;
      padding-right: 12px;
      font-variant-numeric: tabular-nums;
    }
    .entry .name {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: clamp(20px, 2.4vw, 26px);
      line-height: 1.2;
      word-break: break-word;
      transition: color .2s var(--ease), transform .3s var(--ease);
    }
    .entry:hover .name { color: var(--accent-deep); transform: translateX(4px); }
    .entry time {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      color: var(--ink-faint);
      white-space: nowrap;
    }

    .entry.fresh .name::after {
      content: "yangi";
      display: inline-block;
      margin-left: 10px;
      vertical-align: middle;
      font: 500 10px/1 "JetBrains Mono", monospace;
      font-style: normal;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--paper);
      background: var(--accent);
      padding: 4px 7px 3px;
      border-radius: 4px;
      transform: translateY(-3px) rotate(-3deg);
    }
    .entry.fresh { animation: stamp .7s var(--ease) forwards; }

    /* Skeleton */
    .skeleton .bar {
      height: 18px;
      border-radius: 6px;
      background: linear-gradient(90deg, #ebe2d0 0%, #f4ede0 50%, #ebe2d0 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
    }
    .skeleton .bar.short { width: 72px; height: 10px; }
    .skeleton .num .bar { width: 14px; height: 10px; margin-left: auto; }

    /* Empty / error states */
    .state {
      padding: 44px 0 20px clamp(36px, 5vw, 52px);
      opacity: 0;
      animation: rise .7s var(--ease) forwards;
    }
    .state svg { color: var(--accent); margin-bottom: 14px; }
    .state h3 {
      margin: 0 0 6px;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400;
      font-size: 28px;
      letter-spacing: -.01em;
    }
    .state p { margin: 0 0 18px; color: var(--ink-soft); max-width: 36ch; }
    .state.error svg { color: var(--error); }
    .retry {
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font: 500 14px/1 "Instrument Sans", sans-serif;
      padding: 11px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .2s var(--ease), color .2s var(--ease);
    }
    .retry:hover { background: var(--ink); color: var(--paper); }
    .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    footer {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--rule);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ---------- Motion ---------- */
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes settle {
      from { opacity: 0; transform: translateY(30px) rotate(2.5deg); }
      to   { opacity: 1; transform: translateY(0) rotate(.6deg); }
    }
    @keyframes stamp {
      0%   { opacity: 0; transform: scale(1.06) translateX(-8px); background: rgba(176, 84, 46, .12); }
      60%  { opacity: 1; transform: scale(1); background: rgba(176, 84, 46, .08); }
      100% { opacity: 1; transform: scale(1); background: transparent; }
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @keyframes shake {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg) translateX(2px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        transition-duration: .01ms !important;
      }
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 860px) {
      .page { grid-template-columns: 1fr; gap: 48px; }
      .intro { position: static; }
      .ledger { transform: none; animation-name: rise; }
      .ledger::after { inset: 8px -4px -8px 4px; transform: rotate(-1deg); }
    }
    @media (max-width: 480px) {
      .entry { grid-template-columns: 34px 1fr; }
      .entry time { grid-column: 2; margin-top: 4px; }
      .actions { flex-direction: column-reverse; align-items: stretch; }
      button.save { justify-content: center; }
      .hint { text-align: center; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="intro">
      <span class="eyebrow" id="status"><span class="dot"></span><span id="status-text">Daftar ochiq</span></span>
      <h1>Mehmonlar <em>daftari</em></h1>
      <p class="lede">Bu sahifaga kirdingizmi? Ismingizni yozib qoldiring — u daftarning eng yuqorisida paydo bo‘ladi.</p>

      <form class="sign" id="sign" novalidate>
        <label for="name">Sizning ismingiz</label>
        <div class="field">
          <input id="name" name="name" placeholder="Masalan, Dilnoza" maxlength="100" autocomplete="given-name" required>
          <span class="counter" id="counter" aria-hidden="true">0/100</span>
        </div>
        <div class="actions">
          <span class="hint" id="hint" aria-live="polite"><kbd>Enter</kbd> bosib ham saqlash mumkin</span>
          <button type="submit" class="save" id="save">
            <span id="save-label">Saqlash</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
          </button>
        </div>
      </form>
    </section>

    <section class="ledger" aria-labelledby="ledger-title">
      <header class="ledger-head">
        <h2 id="ledger-title">So‘nggi yozuvlar</h2>
        <span class="tally" id="tally">—</span>
      </header>
      <ul id="list" aria-live="polite" aria-busy="true"></ul>
    </section>

    <footer>
      <span>Netlify Functions + MySQL</span>
      <span>Oxirgi 50 ta yozuv</span>
    </footer>
  </main>

<script>
const API = "/.netlify/functions/api";

const $ = (id) => document.getElementById(id);
const list = $("list");
const input = $("name");
const form = $("sign");
const hint = $("hint");
const saveBtn = $("save");
const DEFAULT_HINT = hint.innerHTML;

const MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];

function formatDate(value) {
  const d = new Date(value);
  if (isNaN(d)) return "";
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff >= 0 && diff < 60) return "hozirgina";
  if (diff >= 0 && diff < 3600) return Math.floor(diff / 60) + " daqiqa oldin";
  if (diff >= 0 && diff < 86400 && d.getDate() === now.getDate()) return Math.floor(diff / 3600) + " soat oldin";
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const year = d.getFullYear() !== now.getFullYear() ? " " + d.getFullYear() : "";
  return d.getDate() + " " + MONTHS[d.getMonth()] + year + ", " + hh + ":" + mm;
}

function setStatus(ok) {
  $("status").classList.toggle("offline", !ok);
  $("status-text").textContent = ok ? "Daftar ochiq" : "Aloqa uzildi";
}

function renderSkeleton() {
  list.setAttribute("aria-busy", "true");
  list.innerHTML = "";
  const widths = [62, 44, 78, 52, 68];
  widths.forEach((w, i) => {
    const li = document.createElement("li");
    li.className = "entry skeleton";
    li.style.setProperty("--i", i);
    li.innerHTML =
      '<span class="num"><span class="bar"></span></span>' +
      '<span><span class="bar" style="width:' + w + '%"></span></span>' +
      '<span class="bar short"></span>';
    list.appendChild(li);
  });
}

function renderState(kind) {
  list.innerHTML = "";
  const li = document.createElement("li");
  li.className = "state" + (kind === "error" ? " error" : "");
  if (kind === "error") {
    li.innerHTML =
      '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>' +
      "<h3>Daftarni ochib bo‘lmadi</h3>" +
      "<p>Server bilan bog‘lanishda muammo yuz berdi. Birozdan so‘ng qayta urinib ko‘ring.</p>" +
      '<button type="button" class="retry">Qayta urinish</button>';
    li.querySelector(".retry").addEventListener("click", () => load());
  } else {
    li.innerHTML =
      '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2Z"/><path d="M18 19v3H6a2 2 0 0 1 0-4"/><path d="M9 8h6"/></svg>' +
      "<h3>Daftar hali bo‘sh</h3>" +
      "<p>Birinchi sahifani siz ochasiz — chap tomondagi maydonga ismingizni yozing.</p>";
  }
  list.appendChild(li);
}

function renderRows(rows, freshName) {
  list.innerHTML = "";
  const total = rows.length;
  $("tally").innerHTML = "<strong>" + total + "</strong> ta yozuv";
  if (!total) { renderState("empty"); return; }

  rows.forEach((r, i) => {
    const li = document.createElement("li");
    li.className = "entry";
    li.style.setProperty("--i", Math.min(i, 14));
    if (i === 0 && freshName && r.name === freshName) li.classList.add("fresh");

    const num = document.createElement("span");
    num.className = "num";
    num.textContent = String(total - i).padStart(2, "0");

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = r.name;

    const time = document.createElement("time");
    const d = new Date(r.created_at);
    if (!isNaN(d)) time.dateTime = d.toISOString();
    time.textContent = formatDate(r.created_at);

    li.append(num, name, time);
    list.appendChild(li);
  });
}

async function fetchRows(options) {
  const res = await fetch(API, options);
  const data = await res.json().catch(() => null);
  if (!res.ok || !Array.isArray(data)) throw new Error("bad response");
  return data;
}

async function load(freshName) {
  if (!freshName) renderSkeleton();
  try {
    const rows = await fetchRows();
    setStatus(true);
    renderRows(rows, freshName);
  } catch (e) {
    setStatus(false);
    $("tally").textContent = "—";
    renderState("error");
  } finally {
    list.setAttribute("aria-busy", "false");
  }
}

function showError(message) {
  form.classList.add("has-error");
  hint.textContent = message;
  form.classList.remove("shake");
  void form.offsetWidth;
  form.classList.add("shake");
}

function clearError() {
  if (!form.classList.contains("has-error")) return;
  form.classList.remove("has-error");
  hint.innerHTML = DEFAULT_HINT;
}

input.addEventListener("input", () => {
  $("counter").textContent = input.value.length + "/100";
  clearError();
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = input.value.trim();
  if (!name) { showError("Avval ismingizni yozing"); input.focus(); return; }

  saveBtn.disabled = true;
  $("save-label").textContent = "Yozilmoqda…";
  list.setAttribute("aria-busy", "true");
  try {
    const rows = await fetchRows({ method: "POST", body: JSON.stringify({ name }) });
    input.value = "";
    $("counter").textContent = "0/100";
    setStatus(true);
    renderRows(rows, name.slice(0, 100));
    hint.textContent = "Rahmat! Ismingiz daftarga yozildi.";
    setTimeout(() => { if (!form.classList.contains("has-error")) hint.innerHTML = DEFAULT_HINT; }, 3500);
  } catch (err) {
    setStatus(false);
    showError("Saqlab bo‘lmadi. Qayta urinib ko‘ring.");
  } finally {
    saveBtn.disabled = false;
    $("save-label").textContent = "Saqlash";
    list.setAttribute("aria-busy", "false");
  }
});
